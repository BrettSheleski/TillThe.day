<!doctype html>
<!-- Pages with a fixed theme (e.g. holiday pages) set it here, so it applies before any script runs -->
<html lang="en"{% if page.theme %} data-theme="{{ page.theme }}"{% endif %}{% if page.mode %} data-mode="{{ page.mode }}"{% endif %}>
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main class="card">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include analytics.html %}
  {% if page.script %}
  {% assign script_path = '/assets/js/' | append: page.script | append: '.js' %}
  <script type="module" src="{% include asset-url.html path=script_path %}"></script>
  {% endif %}
</body>
</html>
