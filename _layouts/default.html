<!doctype html>
<!-- Pages with a fixed theme (e.g. holiday pages) set it here, so it applies before any script runs -->
<html lang="en"{% if page.theme %} data-theme="{{ page.theme }}"{% endif %}>
<head>
  {% include head.html %}
</head>
<body>
  {% include header.html %}
  <main class="card">
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.script %}
  <script type="module" src="{{ '/assets/js/' | append: page.script | append: '.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
