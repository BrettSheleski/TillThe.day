<!-- The countdown and the buttons under it. Driven by src/lib/countdown-view.ts. -->
{% include clock.html %}

<!-- data-embed: where the embed page lives, for the "Embed on a website" code -->
<div id="view-actions" class="actions" data-embed="{{ '/embed/' | relative_url }}" hidden>
  <button id="copy-link" type="button">Copy link</button>
  <details id="share-menu" class="dropdown">
    <summary class="button secondary">Share</summary>
    <div class="menu">
      <button id="share-native" type="button" hidden>Share via&hellip;</button>
      <a id="share-email">Email</a>
      <a id="share-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
      <a id="share-facebook" target="_blank" rel="noopener">Facebook</a>
      <a id="share-x" target="_blank" rel="noopener">X (Twitter)</a>
      <button id="share-qr" type="button">QR code</button>
      <button id="share-embed" type="button">Embed on a website</button>
    </div>
  </details>
  <details id="calendar-menu" class="dropdown">
    <summary class="button secondary">Add to calendar</summary>
    <div class="menu">
      <a id="calendar-google" target="_blank" rel="noopener">Google Calendar</a>
      <a id="calendar-outlook" target="_blank" rel="noopener">Outlook.com</a>
      <a id="calendar-ics">Apple / Outlook / other (.ics)</a>
    </div>
  </details>
  <button id="present" type="button" class="secondary" title="Full screen (F)" hidden>Full screen</button>
  <a href="{{ '/' | relative_url }}" class="button secondary">Make your own</a>
</div>

<!-- Shown only in full-screen mode; fades out with the cursor when idle -->
<button id="exit-present" type="button" class="exit-present secondary" hidden>Exit full screen</button>

<dialog id="qr-dialog" class="dialog qr-dialog" aria-labelledby="qr-title">
  <h2 id="qr-title">Scan to open</h2>
  <img id="qr-image" alt="QR code linking to this countdown" width="240" height="240">
  <div class="actions">
    <a id="qr-download" class="button secondary">Download</a>
    <button id="qr-close" type="button">Close</button>
  </div>
</dialog>

<dialog id="embed-dialog" class="dialog embed-dialog" aria-labelledby="embed-title">
  <h2 id="embed-title">Embed on a website</h2>
  <p class="hint">Paste this code into your site's HTML to show a live countdown:</p>
  <textarea id="embed-code" rows="4" readonly aria-label="Embed code"></textarea>
  <p class="hint">Preview</p>
  <div id="embed-preview" class="embed-preview"></div>
  <div class="actions">
    <button id="embed-copy" type="button">Copy code</button>
    <button id="embed-close" type="button" class="secondary">Close</button>
  </div>
</dialog>
