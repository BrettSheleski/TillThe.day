<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- <title>, description, canonical URL and link-preview tags, from the page's
     title, description and image (see jekyll-seo-tag in _config.yml) -->
{% seo %}
<!-- Site icons: SVG for modern browsers, PNG for the rest, and a full-square
     icon for iPhone home screens. Source: assets/images/favicon.svg -->
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" href="{{ '/assets/images/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<!-- Fonts used by the themes (_sass/themes/). Browsers only download the ones
     the current theme actually uses. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&family=Fredoka:wght@400;500;600;700&family=Great+Vibes&family=Jost:wght@300;400;500&family=Lora:wght@400;600&family=Mountains+of+Christmas:wght@400;700&family=Orbitron:wght@500;700&family=Pacifico&family=Press+Start+2P&family=Quicksand:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
