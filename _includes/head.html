<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- <title>, description, canonical URL and link-preview tags, from the page's
     title, description and image (see jekyll-seo-tag in _config.yml) -->
{% seo %}
<!-- Site icons: SVG for modern browsers, PNG for the rest, and a full-square
     icon for iPhone home screens. Source: assets/images/favicon.svg -->
<link rel="icon" href="{% include asset-url.html path='/assets/images/favicon.svg' %}" type="image/svg+xml">
<link rel="icon" href="{% include asset-url.html path='/assets/images/favicon-32.png' %}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{% include asset-url.html path='/assets/images/apple-touch-icon.png' %}">
<!-- Includes the theme fonts, served from this site (see _sass/_fonts.scss) -->
<link rel="stylesheet" href="{% include asset-url.html path='/assets/css/style.css' %}">
