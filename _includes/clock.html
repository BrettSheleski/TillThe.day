<!-- The countdown display itself. Driven by src/lib/countdown-view.ts. -->
<!-- Visible from the start, with placeholders, so its space is reserved -->
<section id="countdown">
  <!-- role="timer" keeps screen readers from announcing every second's tick -->
  <div class="clock" role="timer">
    <div class="unit"><span id="days">--</span><label>days</label></div>
    <div class="unit"><span id="hours">--</span><label>hours</label></div>
    <div class="unit"><span id="minutes">--</span><label>minutes</label></div>
    <div class="unit"><span id="seconds">--</span><label>seconds</label></div>
  </div>
  <p class="status"><span id="status">&nbsp;</span> <span id="message"></span></p>
  <p id="target-label" class="target">&nbsp;</p>
</section>
