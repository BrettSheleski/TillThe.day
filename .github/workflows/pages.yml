# Compiles the TypeScript, builds the Jekyll site and deploys it to GitHub Pages.
# Requires Settings → Pages → Source to be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily, after midnight across the US, so holiday pages' upcoming dates and
  # FAQ (worked out at build time) move on once a holiday has passed
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Failing tests stop the deploy
      - run: npm test
      - run: npm run build
      - id: pages
        uses: actions/configure-pages@v5
      # Build for the address in the repo's Pages settings, e.g.
      # https://tillthe.day, so links, the sitemap and link previews use
      # https (Jekyll's own guess stays on http). Nothing in the repo names
      # the domain.
      - run: |
          printf 'url: "%s"\nbaseurl: "%s"\n' "${{ steps.pages.outputs.origin }}" "${{ steps.pages.outputs.base_path }}" >> _config.yml
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
