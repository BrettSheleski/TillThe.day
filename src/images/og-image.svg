<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for assets/images/og-image.png, the link-preview image (1200x630),
       in the generic theme's style. After editing, export it to that PNG at
       the same size. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0f1222" flood-opacity="0.14"/>
    </filter>
    <filter id="unit-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f1222" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Page and soft color glows: indigo top left, pink top right, teal bottom -->
  <rect width="1200" height="630" fill="#f5f6fb"/>
  <g filter="url(#glow)">
    <circle cx="150" cy="60" r="260" fill="#6366f1" fill-opacity="0.32"/>
    <circle cx="1080" cy="110" r="230" fill="#ec4899" fill-opacity="0.22"/>
    <circle cx="720" cy="660" r="280" fill="#14b8a6" fill-opacity="0.24"/>
  </g>

  <!-- Frosted card -->
  <rect x="90" y="60" width="1020" height="510" rx="40" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff" stroke-width="2" filter="url(#card-shadow)"/>

  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <!-- The logo (assets/images/favicon.svg) beside the name -->
    <g transform="translate(345 96) scale(1.25)">
      <rect width="64" height="64" rx="14" fill="url(#accent)"/>
      <path d="M12 21a7 7 0 0 1 7-7h26a7 7 0 0 1 7 7v17L36 54H19a7 7 0 0 1-7-7z" fill="#ffffff"/>
      <path d="M12 21a7 7 0 0 1 7-7h26a7 7 0 0 1 7 7v4H12z" fill="#cecbf6"/>
      <path d="M52 38H36v16z" fill="#afa9ec"/>
      <circle cx="26" cy="38" r="7" fill="#d85a30"/>
    </g>
    <text x="445" y="165" font-size="76" font-weight="800" fill="url(#accent)" letter-spacing="-2" text-anchor="start">Till the Day</text>
    <text x="600" y="218" font-size="29" fill="#5f6680">Count down to any date and share the link</text>

    <!-- Sample clock: four glass boxes -->
    <g transform="translate(170 262)" filter="url(#unit-shadow)">
      <rect width="190" height="168" rx="24" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
      <text x="95" y="104" font-size="80" font-weight="700" fill="#0f1222" letter-spacing="-2">12</text>
      <text x="95" y="142" font-size="19" font-weight="600" fill="#5f6680" letter-spacing="3">DAYS</text>
    </g>
    <g transform="translate(390 262)" filter="url(#unit-shadow)">
      <rect width="190" height="168" rx="24" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
      <text x="95" y="104" font-size="80" font-weight="700" fill="#0f1222" letter-spacing="-2">08</text>
      <text x="95" y="142" font-size="19" font-weight="600" fill="#5f6680" letter-spacing="3">HOURS</text>
    </g>
    <g transform="translate(610 262)" filter="url(#unit-shadow)">
      <rect width="190" height="168" rx="24" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
      <text x="95" y="104" font-size="80" font-weight="700" fill="#0f1222" letter-spacing="-2">45</text>
      <text x="95" y="142" font-size="19" font-weight="600" fill="#5f6680" letter-spacing="3">MINUTES</text>
    </g>
    <g transform="translate(830 262)" filter="url(#unit-shadow)">
      <rect width="190" height="168" rx="24" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
      <text x="95" y="104" font-size="80" font-weight="700" fill="#0f1222" letter-spacing="-2">30</text>
      <text x="95" y="142" font-size="19" font-weight="600" fill="#5f6680" letter-spacing="3">SECONDS</text>
    </g>

    <!-- Gradient pill, like the site's primary buttons -->
    <rect x="370" y="470" width="460" height="56" rx="28" fill="url(#accent)"/>
    <text x="600" y="507" font-size="24" font-weight="600" fill="#ffffff">Birthdays · holidays · trips · anything</text>
  </g>
</svg>
