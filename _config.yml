title: Time Until
description: Count down to any date and share the link.

# Cloudflare Web Analytics token (from the Cloudflare dashboard: Analytics &
# Logs > Web Analytics). Leave empty to turn analytics off. See
# _includes/analytics.html.
cloudflare_analytics_token: "a0ec4b95c7c4443bb65ed232ff329f00"

# GitHub Pages fills in `url` and `baseurl` automatically from the repo name.
# Only set baseurl if you need to override it, e.g. for a custom domain:
# baseurl: ""

# Files that shouldn't be published to the site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .claude
  - src
  - node_modules
  - package.json
  - package-lock.json
  - tsconfig.json
  - tests
  - scripts
  - vitest.config.ts

sass:
  style: compressed

# Holiday countdown pages: one Markdown file each in _holidays/, published at
# /<file name>/ and laid out by _layouts/holiday.html
collections:
  holidays:
    output: true
    permalink: /:name/

defaults:
  # The image shown in link previews, unless a page sets its own
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      type: holidays
    values:
      layout: holiday
      # Always shows a countdown (see src/head/early.ts)
      mode: view
      # Loads assets/js/holiday.js, compiled from src/pages/holiday.ts
      script: holiday

# Both are supported by GitHub Pages (part of the github-pages gem):
# - jekyll-sitemap generates sitemap.xml listing every page, for search engines
# - jekyll-seo-tag generates the {% seo %} tags in _includes/head.html: title,
#   description, canonical URL, and link-preview (Open Graph / Twitter) tags
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
