title: Till the Day
description: Count down to any date and share the link.

# Cloudflare Web Analytics token (from the Cloudflare dashboard: Analytics &
# Logs > Web Analytics). Leave empty to turn analytics off. See
# _includes/analytics.html.
cloudflare_analytics_token: "d964511e4dd7472d991706760b09432e"

# `url` and `baseurl` come from the repo's Pages settings: the deploy workflow
# adds them from there (e.g. https://tillthe.day, served from the domain's
# root). Nothing here names the domain, so changing it is only that setting.

# Files that shouldn't be published to the site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .claude
  - src
  - node_modules
  - package.json
  - package-lock.json
  - tsconfig.json
  - tests
  - scripts
  - vitest.config.ts

sass:
  style: compressed

# Holiday countdown pages: one Markdown file each in _holidays/, published at
# /<file name>/ and laid out by _layouts/holiday.html
collections:
  holidays:
    output: true
    permalink: /:name/
  # Occasion pages (e.g. /wedding/): the create form preset for an occasion,
  # with tips. One Markdown file each in _occasions/, laid out by
  # _layouts/occasion.html
  occasions:
    output: true
    permalink: /:name/

defaults:
  # The image shown in link previews, unless a page sets its own
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      type: holidays
    values:
      layout: holiday
      # Always shows a countdown (see src/head/early.ts)
      mode: view
      # Loads assets/js/holiday.js, compiled from src/pages/holiday.ts
      script: holiday
      # The "Coming up" card under the countdown (_includes/coming-up.html)
      coming_up: true
  - scope:
      type: occasions
    values:
      layout: occasion
      # The home page's script: the same create form
      script: index

# Both are supported by GitHub Pages (part of the github-pages gem):
# - jekyll-sitemap generates sitemap.xml listing every page, for search engines
# - jekyll-seo-tag generates the {% seo %} tags in _includes/head.html: title,
#   description, canonical URL, and link-preview (Open Graph / Twitter) tags
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
